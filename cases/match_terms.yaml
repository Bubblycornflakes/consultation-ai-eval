# Words a patient reply contains when it reveals a hidden fact. Used by src/score.py (rule-based scoring).
# A fact counts as uncovered if ANY listed phrase appears (case-insensitive) in a patient reply after the
# opening line. The presenting complaint (f01) is given in the opening line and is not scored.
# Kept in its own file so the approved case files stay exactly as approved.
# Limits: a phrase can match when the patient mentions the topic without giving the fact, and an invented
# detail that happens to use one of these phrases would be credited. The hand-labelled check measures this.

